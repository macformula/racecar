[platformio]
src_dir = .
name = "Front Controller"
description = "The brain of the car. Handles accumulator sequencing, motor control, and vehicle dynamics."
default_envs = vehicle

[env]
build_type = debug
debug_build_flags = -g
; Static Code Analysis
; Initial Check found NO high severity defects
check_tool = clangtidy
check_skip_packages = yes
check_src_filters =
    +<source/**>
    +<include/**>
    -<source/platforms/stm32-ev6/**>

[common]
lib_deps =
    Embedded Template Library@^20
    cangen=file://../../scripts/cangen
    fc_common=symlink://../../lib/fc_common
build_src_filter =
    +<**/*.*>
    ; Exclude top-level platforms/ and mcal/ - each `env` will re-add what it needs
    -<platforms/>
    -<mcal/>
    -<**/test*> ; TODO: Add an env:native for testing
flags = 
    -std=c++20
    -Werror
    -Wall
    -Wno-unused-function ;  having problems with unused MPU_Config()
extra_scripts =
    pre:../../scripts/build/generate_git_hash.py

[env:vehicle]
lib_ldf_mode = deep+
lib_extra_dirs =
    ../../lib
    ../../lib/mcal
platform = ststm32
platform_packages = platformio/toolchain-gccarmnoneeabi@^1.140201.0
framework = stm32cube
board = nucleo_f767zi
upload_protocol = stlink

lib_deps = 
    ${common.lib_deps}
    mincrmatt12/STM32Cube Middleware-FreeRTOS@10.3.1+f4-1.26.1
lib_ignore =
    mcal
custom_freertos_heap_impl = ""
custom_freertos_config_location = Inc/FreeRTOSConfig.h

extra_scripts =
    ${common.extra_scripts}
    pre:../../scripts/build/add_hardfloat.py
    ; post:../../scripts/build/add_stm32f_mcal.py

build_src_filter =
    +<src/*.c>
    +<src/app.cc>
build_flags =
    ${common.flags}
    -IInc
    -Isrc
    -I../../lib
    -I../../lib/atomic_buffer
    -I../../lib/can
    -I../../lib/periph
    -I../../lib/mcal/stm32f

board_build.ldscript = src/platforms/stm32-ev6/linker_scripts/STM32F767ZITX_FLASH.ld

[env:bootloader]
platform = ststm32
platform_packages = platformio/toolchain-gccarmnoneeabi@^1.140201.0
framework = stm32cube
board = nucleo_f767zi
upload_protocol = stlink

extra_scripts =
    pre:../../scripts/build/add_hardfloat.py

build_src_filter =
    +<src/platforms/stm32-ev6/Src/bootloader/main.c>
    +<src/platforms/stm32-ev6/Src/bootloader/stm32f7xx_it.c>
    +<src/platforms/stm32-ev6/Src/shared/can.c>
    +<src/platforms/stm32-ev6/Src/shared/stm32f7xx_hal_timebase_tim.c>
build_flags =
    ${common.flags}
    -IInc
    -Isrc

board_build.ldscript = src/platforms/stm32-ev6/linker_scripts/STM32F767ZITX_BOOT.ld
