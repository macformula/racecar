# Minimum version of pre-commit
minimum_pre_commit_version: "2.9.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Prevent committing directly to the main branch
      - id: no-commit-to-branch
        args: [--branch, main]
        stages: [pre-commit]
    
  # install clang format locally for this to work
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format
        language: system
        types_or: [c, c++]
        args: [-i]